# fleet.conf -- shared configuration, sourced by morning.sh/evening.sh/healthcheck.sh
#
# Mirrors the group structure in lab-ansible/inventory/inventory.ini
# (on admin.beamline) -- kept in MANUAL sync, deliberately not read live
# from admin.beamline, since admin.beamline is itself one of the fleet
# members morning.sh boots and may not be up yet when this is sourced.

declare -A FLEET_GROUPS=(
  [control]="admin.beamline"
  [gitlab]="gitlab.beamline"
  [packaging]="pkg.beamline"
  [configmgmt]="puppet.beamline"
  [k8s_control]="k8cp.beamline"
  [k8s_workers]="k8w1.beamline k8w2.beamline"
  [tango_db]="tango-db.beamline"
  [tango_ds]="tango-ds.beamline"
  [observability]="obs.beamline"
  [hpc_controller]="hpc-ctl.beamline"
  [hpc_compute]="hpc-c1.beamline hpc-gpu.beamline"
)

# Mirrors ":children" groups from inventory.ini.
declare -A FLEET_CHILDREN=(
  [kubernetes]="k8s_control k8s_workers"
  [tango]="tango_db tango_ds"
  [hpc]="hpc_controller hpc_compute"
)

SSH_KEY="$HOME/.ssh/beamline_vms"
SSH_USER="falak"

# Resolve a group name (leaf or :children parent) to a space-separated
# list of real hostnames. Recursive, so a :children group can itself
# reference other :children groups if that's ever needed.
resolve_group() {
  local name="$1"
  if [[ -n "${FLEET_GROUPS[$name]:-}" ]]; then
    echo "${FLEET_GROUPS[$name]}"
  elif [[ -n "${FLEET_CHILDREN[$name]:-}" ]]; then
    local child hosts=""
    for child in ${FLEET_CHILDREN[$name]}; do
      hosts="$hosts $(resolve_group "$child")"
    done
    echo "$hosts"
  else
    echo "ERROR: unknown fleet group '$name'" >&2
    return 1
  fi
}

# All real hosts across every leaf group, deduplicated, in a stable order.
all_fleet_hosts() {
  local group
  for group in "${!FLEET_GROUPS[@]}"; do
    resolve_group "$group"
  done | tr ' ' '\n' | grep -v '^$' | sort -u
}
