# fleet.conf -- fleet data only, sourced by fleet-lib.sh. No logic here.
# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is consumed by fleet-lib.sh

# Groups mirror lab-ansible/inventory/inventory.ini on admin.beamline. Kept in
# manual sync on purpose: admin.beamline is itself a fleet member and may be
# down when this file is read. fleet-check.sh compares the two when it can.
declare -gA FLEET_GROUPS=(
  [control]="admin.beamline"
  [gitlab]="gitlab.beamline"
  [packaging]="pkg.beamline"
  [configmgmt]="puppet.beamline"
  [k8s_control]="k8cp.beamline"
  [k8s_workers]="k8w1.beamline k8w2.beamline"
  [tango_db]="tango-db.beamline"
  [tango_ds]="tango-ds.beamline"
  [observability]="obs.beamline"
  [hpc_controller]="hpc-ctl.beamline"
  [hpc_compute]="hpc-c1.beamline hpc-gpu.beamline"
)

# Mirrors the ":children" groups in inventory.ini.
declare -gA FLEET_CHILDREN=(
  [kubernetes]="k8s_control k8s_workers"
  [tango]="tango_db tango_ds"
  [hpc]="hpc_controller hpc_compute"
)

# Boot order, one tier per element: fleet-up.sh starts tier 1 first,
# fleet-down.sh stops the last tier first and waits for each tier to reach
# "shut off" before the next. Every host in FLEET_GROUPS must appear in
# exactly one tier; fleet-lib.sh refuses to run otherwise.
FLEET_TIERS=(
  "admin.beamline gitlab.beamline pkg.beamline puppet.beamline"
  "k8cp.beamline tango-db.beamline obs.beamline hpc-ctl.beamline"
  "k8w1.beamline k8w2.beamline tango-ds.beamline hpc-c1.beamline hpc-gpu.beamline"
)

# Name suffix: a bare name such as "pkg" in --only/--skip means pkg.beamline.
FLEET_DOMAIN="beamline"

# Timings, in seconds. Every message the scripts print is built from these.
FLEET_START_STAGGER=5         # pause between two "virsh start" calls
FLEET_SHUTDOWN_STAGGER=2      # pause between two "virsh shutdown" calls
FLEET_SSH_WAIT_TIMEOUT=240    # per host: boot until SSH answers
FLEET_SHUTDOWN_TIMEOUT=180    # per tier: ACPI shutdown until "shut off"
FLEET_HOOK_TIMEOUT=60         # per hook, enforced with timeout(1)
FLEET_POLL_INTERVAL=5         # between two state or SSH probes

# SSH from beamlinehost to the VMs.
FLEET_SSH_USER="falak"
FLEET_SSH_KEY="$HOME/.ssh/beamline_vms"
FLEET_SSH_CONNECT_TIMEOUT=5
# "yes": a changed or unknown host key fails the connection. Set "accept-new"
# only while rebuilding VMs, whose keys legitimately change (see the RUNBOOK).
FLEET_SSH_HOST_KEY_CHECKING="yes"

# Post-boot checks run by fleet-up.sh on every host.
FLEET_IFACES="lab0 nat0"      # interfaces that must have an IPv4 address
FLEET_INTERNET_PROBE="8.8.8.8"  # one ping through nat0
